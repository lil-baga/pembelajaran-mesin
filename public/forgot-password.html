<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - LUXBAG</title>
    <link href="css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="grid lg:grid-cols-2 min-h-screen">
        <!-- Left Panel -->
        <aside class="hidden lg:flex flex-col justify-between bg-gradient-to-br from-gray-900 to-black border-r border-gray-800 p-12">
            <div>
                <a href="index.html" class="flex items-center gap-2 text-2xl font-black text-white tracking-tighter">
                    <span class="text-amber-500">LUX</span>BAG
                </a>
            </div>
            <div class="space-y-6">
                <h1 class="text-4xl font-bold leading-tight">Pulihkan akses<br>ke akun Anda</h1>
                <p class="text-gray-400 text-lg max-w-md">Kembali temukan koleksi tas eksklusif dan premium dari berbagai merek ternama di dunia.</p>
                <div class="flex items-center gap-4 text-sm text-gray-500">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-gray-700 border-2 border-gray-900"></div>
                        <div class="w-8 h-8 rounded-full bg-gray-600 border-2 border-gray-900"></div>
                        <div class="w-8 h-8 rounded-full bg-gray-500 border-2 border-gray-900"></div>
                    </div>
                    <p>Bergabung dengan 10.000+ pelanggan eksklusif</p>
                </div>
            </div>
        </aside>

        <!-- Right Panel (Main) -->
        <main class="flex items-center justify-center p-8 sm:p-12 lg:p-16">
            <div class="w-full max-w-md space-y-8">
                <!-- Mobile Logo -->
                <div class="lg:hidden text-center mb-8">
                    <a href="index.html" class="inline-flex items-center gap-2 text-3xl font-black text-white tracking-tighter">
                        <span class="text-amber-500">LUX</span>BAG
                    </a>
                </div>

                <div>
                    <h2 class="text-3xl font-bold tracking-tight text-white">Lupa password?</h2>
                    <p class="mt-2 text-gray-400">Masukkan email Anda dan kami kirimkan tautan untuk mengatur ulang password.</p>
                </div>

                <form id="forgot-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300">Alamat Email</label>
                        <div class="mt-2">
                            <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border border-gray-700 bg-gray-800 py-2.5 px-4 text-white placeholder-gray-500 shadow-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 focus:outline-none sm:text-sm">
                        </div>
                    </div>

                    <button id="submit-btn" type="submit" class="flex w-full justify-center rounded-md bg-amber-500 px-3 py-3 text-sm font-bold text-gray-900 shadow-sm hover:bg-amber-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500 transition-colors">
                        Kirim tautan reset
                    </button>

                    <p id="form-message" class="text-sm text-center hidden"></p>
                </form>

                <p class="text-center text-sm text-gray-400 mt-8">
                    <a href="index.html" class="font-medium text-amber-500 hover:text-amber-400 transition-colors">
                        &larr; Kembali ke login
                    </a>
                </p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
